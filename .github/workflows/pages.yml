name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check translations and JavaScript
        run: |
          python3 scripts/check-site.py
          node --check assets/languages.js
          node --check assets/business.js
          node --check assets/maintenance.js
          node --check assets/host.js
      - name: Check HTML, JavaScript and CSS formatting
        run: npx --yes prettier@latest --check index.html "assets/**/*.{js,css}"
      - name: Check Python formatting
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: format --check
          src: scripts/

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - name: Copy public files for upload
        run: |
          mkdir -p _site
          cp -R index.html robots.txt sitemap.xml assets _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
